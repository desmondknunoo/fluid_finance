    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212" />

    <!-- Data origins: the Fluid Finance editorial API and the GSE live-quote feed (src/lib/gse.ts). -->
    <link rel="preconnect" href="https://api.finance.fluidterra.com" crossorigin />
    <link rel="preconnect" href="https://dev.kwayisi.org" crossorigin />

    <!-- Editorial UI typography; Poppins retained for share renderers. display=swap keeps text visible while fonts load. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Resolve the colour scheme before first paint so the page never flashes
         the wrong theme. Mirrors the logic in src/lib/theme.tsx. -->
    <script>
        (function () {
            var stored = null;
            try { stored = localStorage.getItem('fluidfinance:theme'); } catch (e) { }
            var dark = stored === 'dark' || (stored !== 'light' &&
                window.matchMedia('(prefers-color-scheme: dark)').matches);
            var root = document.documentElement;
            root.classList.add(dark ? 'dark' : 'light');
            root.style.colorScheme = dark ? 'dark' : 'light';
        })();
    </script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
