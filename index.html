    {
        "@context": "https://schema.org",
        "@type": "WebSite",

        "alternateName": "Fluid Terra Finance",

    <!-- Google Fonts - Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Resolve the colour scheme before first paint so the page never flashes
         the wrong theme. Mirrors the logic in src/lib/theme.tsx. -->
    <script>
        (function () {
            var stored = null;
            try { stored = localStorage.getItem('fluidfinance:theme'); } catch (e) { }
            var dark = stored === 'dark' || (stored !== 'light' &&
                window.matchMedia('(prefers-color-scheme: dark)').matches);
            var root = document.documentElement;
            root.classList.add(dark ? 'dark' : 'light');
            root.style.colorScheme = dark ? 'dark' : 'light';
        })();
    </script>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
